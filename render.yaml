# Render Blueprint (optional). Use "New > Blueprint" in Render and point at this file,
# or create the Web Service manually — see docs/DEPLOYMENT.md.
#
# Required env vars to set in Render Dashboard:
#   DATABASE_URL  — Supabase PostgreSQL connection string (see supabase-schema.sql)
#   SECRET_KEY    — random 32+ char string
#   FRONTEND_URL  — your Vercel deployment URL
# PORT is set automatically by Render.

services:
  - type: web
    name: syllabify-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
